[project]
name = "payment-processing-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "pydantic-settings>=2.7", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14", "faststream[rabbit]>=0.6", "httpx>=0.28"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "bandit>=1.8", "radon>=6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/payments"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and RabbitMQ"]
[tool.coverage.run]
source = ["payments"]
[tool.coverage.report]
fail_under = 80
show_missing = true
